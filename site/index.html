<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Independent forecast and variance analysis of Tesla's public filings. Not affiliated with Tesla, Inc."
    />
    <title>Tesla FP&A Agent</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("paper-theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (error) {
          theme = "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>This page needs JavaScript to show the workpaper. Enable it, then reload.</noscript>
  </body>
</html>
